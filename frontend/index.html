<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Carritos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
        }

        .auth-container {
            display: flex;
            gap: 20px;
            padding: 40px;
            justify-content: center;
        }

        .auth-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .auth-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .main-content {
            display: none;
            padding: 20px;
        }

        .main-content.active {
            display: block;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
        }

        .nav-tabs button {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tabs button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table thead {
            background: #f8f9fa;
        }

        table th {
            padding: 12px;
            text-align: left;
            color: #555;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background: #f0f0f0;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                flex-direction: column;
            }

            header {
                flex-direction: column;
                gap: 10px;
            }

            .user-info {
                flex-direction: column;
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Container -->
        <div id="authContainer" class="auth-container active">
            <div class="auth-form">
                <h2>Registrarse</h2>
                <div id="registerAlert" class="alert"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Contraseña:</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
                </form>
            </div>

            <div class="auth-form">
                <h2>Iniciar Sesión</h2>
                <div id="loginAlert" class="alert"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Contraseña:</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
                </form>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="main-content">
            <header>
                <h1>🚗 Sistema de Gestión de Carritos</h1>
                <div class="user-info">
                    <span id="userEmail"></span>
                    <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
                </div>
            </header>

            <div style="padding: 20px;">
                <!-- Navigation Tabs -->
                <div class="nav-tabs">
                    <button onclick="switchTab('usuarios')" class="nav-btn active">Usuarios</button>
                    <button onclick="switchTab('solicitudes')" class="nav-btn">Solicitudes</button>
                    <button onclick="switchTab('carritos')" class="nav-btn">Carritos</button>
                    <button onclick="switchTab('choferes')" class="nav-btn">Choferes</button>
                    <button onclick="switchTab('horarios')" class="nav-btn">Horarios</button>
                    <button onclick="switchTab('despachos')" class="nav-btn">Despachos</button>
                    <button onclick="switchTab('mantenimientos')" class="nav-btn">Mantenimientos</button>
                </div>

                <!-- USUARIOS Tab -->
                <div id="usuarios" class="tab-content active">
                    <div class="form-section">
                        <h3>Crear Nuevo Usuario</h3>
                        <form id="usuariosForm" style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: flex-end;">
                            <div>
                                <label>Email:</label>
                                <input type="email" id="usuarioEmail" placeholder="ejemplo@correo.com" required>
                            </div>
                            <div>
                                <label>Contraseña:</label>
                                <input type="password" id="usuarioPassword" placeholder="Contraseña" required>
                            </div>
                            <div>
                                <label>Nombre:</label>
                                <input type="text" id="usuarioNombre" placeholder="Nombre completo" required>
                            </div>
                            <button type="submit" class="btn btn-success">Crear</button>
                        </form>
                    </div>
                    <h3>Usuarios</h3>
                    <div id="usuariosList"></div>
                </div>

                <!-- SOLICITUDES Tab -->
                <div id="solicitudes" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nueva Solicitud</h3>
                        <form id="solicitudesForm">
                            <div class="grid-2">
                                <div>
                                    <label>Descripción:</label>
                                    <textarea id="solicitudDescripcion" placeholder="Descripción" required></textarea>
                                </div>
                                <div>
                                    <label>Dirección Origen:</label>
                                    <input type="text" id="solicitudOrigen" placeholder="Origen" required>
                                </div>
                                <div>
                                    <label>Dirección Destino:</label>
                                    <input type="text" id="solicitudDestino" placeholder="Destino" required>
                                </div>
                                <div>
                                    <label>Estado:</label>
                                    <select id="solicitudEstado" required>
                                        <option value="Pendiente">Pendiente</option>
                                        <option value="Asignado">Asignado</option>
                                        <option value="En Ruta">En Ruta</option>
                                        <option value="Completado">Completado</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Solicitud</button>
                        </form>
                    </div>
                    <h3>Solicitudes</h3>
                    <div id="solicitudesList"></div>
                </div>

                <!-- CARRITOS Tab -->
                <div id="carritos" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nuevo Carrito</h3>
                        <form id="carritosForm">
                            <div class="grid-2">
                                <div>
                                    <label>Número de Placa:</label>
                                    <input type="text" id="carritoNumero" placeholder="ABC-1234" required>
                                </div>
                                <div>
                                    <label>Modelo:</label>
                                    <input type="text" id="carritoModelo" placeholder="Modelo del carrito" required>
                                </div>
                                <div>
                                    <label>Año:</label>
                                    <input type="number" id="carritoAnio" placeholder="2024" required>
                                </div>
                                <div>
                                    <label>Marca:</label>
                                    <input type="text" id="carritoMarca" placeholder="Marca" required>
                                </div>
                                <div>
                                    <label>Color:</label>
                                    <input type="text" id="carritoColor" placeholder="Color" required>
                                </div>
                                <div>
                                    <label>Capacidad:</label>
                                    <input type="number" id="carritoCapacidad" placeholder="Número de asientos" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Carrito</button>
                        </form>
                    </div>
                    <h3>Carritos</h3>
                    <div id="carritosList"></div>
                </div>

                <!-- CHOFERES Tab -->
                <div id="choferes" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nuevo Chofer</h3>
                        <form id="choferesForm">
                            <div class="grid-2">
                                <div>
                                    <label>Nombre:</label>
                                    <input type="text" id="choferNombre" placeholder="Nombre completo" required>
                                </div>
                                <div>
                                    <label>Licencia:</label>
                                    <input type="text" id="choferLicencia" placeholder="Número de licencia" required>
                                </div>
                                <div>
                                    <label>Celular:</label>
                                    <input type="tel" id="choferCelular" placeholder="Teléfono" required>
                                </div>
                                <div>
                                    <label>Estado:</label>
                                    <select id="choferEstado" required>
                                        <option value="Disponible">Disponible</option>
                                        <option value="En Ruta">En Ruta</option>
                                        <option value="Ocupado">Ocupado</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Chofer</button>
                        </form>
                    </div>
                    <h3>Choferes</h3>
                    <div id="chofersList"></div>
                </div>

                <!-- HORARIOS Tab -->
                <div id="horarios" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nuevo Horario</h3>
                        <form id="horariosForm">
                            <div class="grid-2">
                                <div>
                                    <label>Hora Inicio:</label>
                                    <input type="time" id="horarioInicio" required>
                                </div>
                                <div>
                                    <label>Hora Fin:</label>
                                    <input type="time" id="horarioFin" required>
                                </div>
                                <div>
                                    <label>Día de Semana:</label>
                                    <input type="text" id="horarioDia" placeholder="Lunes, Martes, etc" required>
                                </div>
                                <div>
                                    <label>Activo:</label>
                                    <select id="horarioActivo" required>
                                        <option value="true">Sí</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Horario</button>
                        </form>
                    </div>
                    <h3>Horarios</h3>
                    <div id="horariosList"></div>
                </div>

                <!-- DESPACHOS Tab -->
                <div id="despachos" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nuevo Despacho</h3>
                        <form id="despachosForm">
                            <div class="grid-2">
                                <div>
                                    <label>Fecha:</label>
                                    <input type="date" id="despachoFecha" required>
                                </div>
                                <div>
                                    <label>Ruta:</label>
                                    <input type="text" id="despachoRuta" placeholder="Descripción de la ruta" required>
                                </div>
                                <div>
                                    <label>Número de Carrito:</label>
                                    <input type="text" id="despachoCarro" placeholder="Placa del carrito" required>
                                </div>
                                <div>
                                    <label>Chofer ID:</label>
                                    <input type="number" id="despachoChofer" placeholder="ID del chofer" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Despacho</button>
                        </form>
                    </div>
                    <h3>Despachos</h3>
                    <div id="despachosList"></div>
                </div>

                <!-- MANTENIMIENTOS Tab -->
                <div id="mantenimientos" class="tab-content">
                    <div class="form-section">
                        <h3>Crear Nuevo Mantenimiento</h3>
                        <form id="mantenimientosForm">
                            <div class="grid-2">
                                <div>
                                    <label>Número de Carrito:</label>
                                    <input type="text" id="mantenimientoCarro" placeholder="Placa del carrito" required>
                                </div>
                                <div>
                                    <label>Tipo:</label>
                                    <select id="mantenimientoTipo" required>
                                        <option value="Revisión">Revisión</option>
                                        <option value="Reparación">Reparación</option>
                                        <option value="Cambio de aceite">Cambio de aceite</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                                <div>
                                    <label>Descripción:</label>
                                    <textarea id="mantenimientoDescripcion" placeholder="Descripción del mantenimiento" required></textarea>
                                </div>
                                <div>
                                    <label>Fecha:</label>
                                    <input type="date" id="mantenimientoFecha" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Crear Mantenimiento</button>
                        </form>
                    </div>
                    <h3>Mantenimientos</h3>
                    <div id="mantenimientosList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/v5';
        let token = localStorage.getItem('token');
        let userEmail = localStorage.getItem('userEmail');

        // Check if already logged in
        if (token && userEmail) {
            showMainContent();
        }

        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }

        // AUTH FUNCTIONS
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: email, Password: password })
                });
                const data = await response.json();
                if (response.ok) {
                    showAlert('registerAlert', 'Registro exitoso. Inicia sesión.', 'success');
                    document.getElementById('registerForm').reset();
                } else {
                    showAlert('registerAlert', data.error || 'Error en el registro', 'error');
                }
            } catch (error) {
                showAlert('registerAlert', error.message, 'error');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: email, Password: password })
                });
                const data = await response.json();
                if (response.ok) {
                    token = data.token;
                    userEmail = email;
                    localStorage.setItem('token', token);
                    localStorage.setItem('userEmail', userEmail);
                    showMainContent();
                    loadAllData();
                } else {
                    showAlert('loginAlert', data.error || 'Error en el login', 'error');
                }
            } catch (error) {
                showAlert('loginAlert', error.message, 'error');
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userEmail');
            token = null;
            userEmail = null;
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('authContainer').classList.add('active');
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
        }

        function showMainContent() {
            document.getElementById('authContainer').classList.remove('active');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userEmail').textContent = userEmail;
        }

        // TAB NAVIGATION
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // API FUNCTIONS
        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            };
            if (body) options.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (!response.ok) throw new Error(`Error ${response.status}`);
            return response.json();
        }

        // USUARIOS
        document.getElementById('usuariosForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = {
                Email: document.getElementById('usuarioEmail').value,
                Password: document.getElementById('usuarioPassword').value,
                Nombre: document.getElementById('usuarioNombre').value
            };
            try {
                await apiCall('/usuarios', 'POST', usuario);
                showAlert('registerAlert', 'Usuario creado exitosamente', 'success');
                document.getElementById('usuariosForm').reset();
                loadUsuarios();
            } catch (error) {
                showAlert('registerAlert', error.message, 'error');
            }
        });

        async function loadUsuarios() {
            try {
                const usuarios = await apiCall('/usuarios');
                const html = usuarios.map(u => `
                    <table style="margin-top: 10px;">
                        <tr>
                            <td><strong>ID:</strong> ${u.ID}</td>
                            <td><strong>Email:</strong> ${u.Email}</td>
                            <td><strong>Nombre:</strong> ${u.Nombre}</td>
                            <td>
                                <button class="btn btn-danger btn-small" onclick="deleteUsuario(${u.ID})">Eliminar</button>
                            </td>
                        </tr>
                    </table>
                `).join('');
                document.getElementById('usuariosList').innerHTML = html || '<p class="empty-state">No hay usuarios</p>';
            } catch (error) {
                document.getElementById('usuariosList').innerHTML = `<p class="empty-state">Error: ${error.message}</p>`;
            }
        }

        async function deleteUsuario(id) {
            if (!confirm('¿Estás seguro?')) return;
            try {
                await apiCall(`/usuarios/${id}`, 'DELETE');
                loadUsuarios();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // SOLICITUDES
        document.getElementById('solicitudesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const solicitud = {
                Descripcion: document.getElementById('solicitudDescripcion').value,
                DireccionOrigen: document.getElementById('solicitudOrigen').value,
                DireccionDestino: document.getElementById('solicitudDestino').value,
                Estado: document.getElementById('solicitudEstado').value
            };
            try {
                await apiCall('/solicitudes', 'POST', solicitud);
                showAlert('registerAlert', 'Solicitud creada exitosamente', 'success');
                document.getElementById('solicitudesForm').reset();
                loadSolicitudes();
            } catch (error) {
                showAlert('registerAlert', error.message, 'error');
            }
        });

        async function loadSolicitudes() {
            try {
                const solicitudes = await apiCall('/solicitudes');
                const html = solicitudes.map(s => `
                    <table style="margin-top: 10px;">
                        <tr>
                            <td><strong>ID:</strong> ${s.ID}</td>
                            <td><strong>Descripción:</strong> ${s.Descripcion}</td>
                            <td><strong>Origen:</strong> ${s.DireccionOrigen}</td>
                            <td><strong>Destino:</strong> ${s.DireccionDestino}</td>
                            <td><strong>Estado:</strong> ${s.Estado}</td>
                            <td>
                                <button class="btn btn-danger btn-small" onclick="deleteSolicitud(${s.ID})">Eliminar</button>
                            </td>
                        </tr>
                    </table>
                `).join('');
                document.getElementById('solicitudesList').innerHTML = html || '<p class="empty-state">No hay solicitudes</p>';
            } catch (error) {
                document.getElementById('solicitudesList').innerHTML = `<p class="empty-state">Error: ${error.message}</p>`;
            }
        }

        async function deleteSolicitud(id) {
            if (!confirm('¿Estás seguro?')) return;
            try {
                await apiCall(`/solicitudes/${id}`, 'DELETE');
                loadSolicitudes();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // CARRITOS
        document.getElementById('carritosForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const carrito = {
                NumeroPlaca: document.getElementById('carritoNumero').value,
                Modelo: document.getElementById('carritoModelo').value,
                Anio: parseInt(document.getElementById('carritoAnio').value),
                Marca: document.getElementById('carritoMarca').value,
                Color: document.getElementById('carritoColor').value,
                Capacidad: parseInt(document.getElementById('carritoCapacidad').value)
            };
            try {
                await apiCall('/carritos', 'POST', carrito);
                showAlert('registerAlert', 'Carrito creado exitosamente', 'success');
